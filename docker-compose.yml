services:
  neo4j:
    image: neo4j:5.24
    ports:
      - "7474:7474"   # Neo4j browser UI
      - "7687:7687"   # Bolt driver
    environment:
      - NEO4J_AUTH=neo4j/swimple123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
