<title>Swimple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

<style>
/* ══ TOKENS ══ */
:root {
  --bg: #05050F;
  --g1: rgba(12,12,30,0.55);
  --g2: rgba(22,22,48,0.65);
  --g3: rgba(32,32,68,0.75);
  --gb: rgba(255,255,255,0.07);
  --gb2: rgba(255,255,255,0.12);
  --blur: blur(28px) saturate(1.5);
  --ac: #EDAE49; --ac2: #F47B3C;
  --ag: rgba(237,174,73,0.10); --ag2: rgba(237,174,73,0.04);
  --tk: #5B8FFF; --tk2: #26C6DA;
  --tkg: rgba(91,143,255,0.10); --tkg2: rgba(91,143,255,0.04);
  --t1: #ECEEF8; --t2: #7070A0; --t3: #35355A;
  --fd: 'Syne',system-ui,sans-serif;
  --fb: 'DM Sans',system-ui,sans-serif;
  --r: 22px; --rs: 12px; --rss: 8px;
}
.mode-ticket { --ac:var(--tk);--ac2:var(--tk2);--ag:var(--tkg);--ag2:var(--tkg2); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--fb);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--fb);cursor:pointer;border:none;background:transparent}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ══ AURORA ══ */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ab{position:absolute;border-radius:50%;filter:blur(90px);animation:abF 22s ease-in-out infinite}
.ab1{width:700px;height:600px;background:rgba(237,174,73,.09);top:-15%;left:-10%;animation-delay:0s}
.ab2{width:600px;height:700px;background:rgba(91,143,255,.07);bottom:-15%;right:-5%;animation-delay:-8s}
.ab3{width:500px;height:450px;background:rgba(38,198,218,.05);top:25%;left:55%;animation-delay:-16s}
@keyframes abF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-70px) scale(1.1)}66%{transform:translate(-35px,45px) scale(.93)}}

/* ══ GLASS ══ */
.glass{background:var(--g1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--gb);border-radius:var(--r)}

/* ══ APP SHELL ══ */
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:14px;gap:12px}

/* ══ HEADER ══ */
.app-header{display:flex;align-items:center;padding:10px 20px;gap:12px;flex-shrink:0;border-radius:16px}
.logo{display:flex;align-items:center;gap:9px}
.logo-gem{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:13px;color:#000;font-weight:900;transition:background .3s}
.logo-name{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo-sep{width:1px;height:18px;background:var(--gb2);margin:0 4px}
.logo-suite{font-size:11px;color:var(--t2);letter-spacing:.12em;font-weight:600;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:6px;margin-left:auto}
.hbtn{width:32px;height:32px;border-radius:var(--rss);border:1px solid var(--gb);color:var(--t2);display:flex;align-items:center;justify-content:center;transition:all .14s}
.hbtn:hover{background:var(--g2);color:var(--t1);border-color:var(--gb2)}
.hbtn.on{color:var(--ac);background:var(--ag);border-color:rgba(237,174,73,.25)}
.new-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--rss);border:1px solid var(--gb2);color:var(--t2);font-size:12.5px;font-weight:500;transition:all .14s}
.new-btn:hover{background:var(--g2);color:var(--t1);border-color:var(--ac)}
.mode-pill{padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--ag);color:var(--ac);border:1px solid rgba(237,174,73,.22);transition:all .3s}

/* ══ BODY ══ */
.app-body{display:grid;grid-template-columns:300px 1fr;gap:12px;flex:1;min-height:0}

/* ══ AVATAR PANEL ══ */
.avatar-panel{display:flex;flex-direction:column;align-items:center;padding:24px 18px 20px;gap:12px;position:relative;overflow:hidden}
.avatar-panel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:200px;background:radial-gradient(ellipse 80% 60% at 50% 100%,var(--ag),transparent);pointer-events:none;z-index:0}
.av-info-col{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%}
.av-name{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:-.015em;text-align:center}
.av-sub{font-size:10.5px;color:var(--t2);letter-spacing:.14em;text-align:center;font-weight:600;text-transform:uppercase}
.orb-wrap{position:relative;width:200px;height:200px;flex-shrink:0;margin:2px 0;z-index:1}
.orb-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.orb-glow{position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,var(--ag),transparent 70%);animation:orbP 3s ease-in-out infinite;pointer-events:none}
@keyframes orbP{0%,100%{opacity:.6}50%{opacity:1}}
.av-status{font-size:10px;letter-spacing:.2em;font-weight:700;color:var(--t3);text-align:center;transition:color .3s}
.av-status.listening{color:#4ADE80}.av-status.thinking,.av-status.speaking{color:var(--ac)}

.agent-pills{display:flex;gap:6px;padding:5px;border-radius:var(--rs);background:rgba(0,0,0,.3);border:1px solid var(--gb);position:relative;z-index:1;width:100%}
.ap{flex:1;padding:7px 8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--t2);transition:all .18s;text-align:center;border:1px solid transparent}
.ap.active{background:var(--ag);color:var(--ac);border-color:rgba(237,174,73,.2)}
.ap:not(.active):hover{background:var(--g2);color:var(--t1)}

.doc-badge{display:none;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--rs);background:var(--ag2);border:1px solid rgba(237,174,73,.18);font-size:12px;color:var(--ac);width:100%;position:relative;z-index:1}
.doc-badge.show{display:flex}
.db-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.db-clr{color:var(--t3);font-size:15px;line-height:1;transition:color .12s}
.db-clr:hover{color:var(--t1)}

.upload-area{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:var(--rs);border:1px dashed rgba(237,174,73,.2);color:var(--t2);font-size:12.5px;width:100%;cursor:pointer;transition:all .15s;background:var(--ag2);position:relative;z-index:1}
.upload-area:hover{border-color:rgba(237,174,73,.45);color:var(--t1);background:var(--ag)}
.upload-area svg{color:var(--ac);flex-shrink:0}

.hist-label{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--t3);text-transform:uppercase;align-self:flex-start;padding-left:2px;position:relative;z-index:1}
.hist-list{width:100%;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;position:relative;z-index:1}
.hist-list::-webkit-scrollbar{width:2px}
.hist-list::-webkit-scrollbar-thumb{background:var(--gb2);border-radius:1px}
.hi{padding:6px 10px;border-radius:var(--rss);font-size:12.5px;color:var(--t2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .12s}
.hi:hover,.hi.active{background:var(--g2);color:var(--t1)}

/* ══ CHAT PANEL ══ */
.chat-panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:22px 24px 10px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--gb);border-radius:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.empty-title{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,var(--t1) 20%,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty-sub{font-size:14px;color:var(--t2);max-width:340px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px}
.chip{padding:7px 15px;border-radius:100px;border:1px solid var(--gb2);background:var(--g2);color:var(--t2);font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ac);color:var(--t1);background:var(--ag)}
.msg-row{display:flex;padding:4px 0;gap:10px;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.m-av{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:3px;position:relative}
.msg-row.ai .m-av,.msg-row.system .m-av{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;transition:background .3s}
.msg-row.system .m-av{background:rgba(237,174,73,.12);color:var(--ac)}
.msg-row.user .m-av{background:var(--g3);color:var(--t2)}
.m-av.speaking::after{content:'';position:absolute;inset:-5px;border-radius:11px;border:1.5px solid var(--ac);animation:avRing 1.1s ease-out infinite}
@keyframes avRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.m-body{max-width:min(580px,78%);display:flex;flex-direction:column;gap:3px}
.msg-row.user .m-body{align-items:flex-end}
.msg-row.system .m-body{max-width:100%;width:100%}
.m-bubble{padding:11px 14px;border-radius:var(--r);font-size:14px;line-height:1.65}
.msg-row.user .m-bubble{background:var(--g2);border:1px solid var(--gb);border-radius:var(--r) var(--r) 5px var(--r)}
.msg-row.ai .m-bubble{padding:4px 2px}
.msg-row.system .m-bubble{background:rgba(237,174,73,.05);border:1px solid rgba(237,174,73,.14);border-radius:var(--rs);font-size:13px;color:var(--t2);padding:10px 14px}
.thinking{display:flex;gap:5px;padding:12px 2px;align-items:center}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--ac);opacity:.4;animation:tdot 1.3s ease-in-out infinite}
.thinking span:nth-child(2){animation-delay:.18s}.thinking span:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac);margin-left:1px;vertical-align:text-bottom;animation:cblink .75s step-end infinite}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
.m-bubble strong{color:var(--ac);font-weight:600}
.m-bubble code{font-family:'Consolas','Monaco',monospace;font-size:.88em;background:var(--g3);padding:1px 5px;border-radius:4px}
.m-bubble pre{background:var(--g2);border:1px solid var(--gb2);border-radius:var(--rs);padding:12px 14px;overflow-x:auto;font-family:'Consolas','Monaco',monospace;font-size:12.5px;line-height:1.55;margin:8px 0}
.m-bubble .divline{height:1px;background:var(--gb2);margin:10px 0}
.m-bubble .warn{font-size:13px;color:var(--t2);margin-top:8px;padding:8px 12px;background:var(--ag2);border-radius:var(--rs);border-left:2px solid var(--ac)}

/* ══ INPUT ══ */
.input-area{padding:10px 18px 16px;flex-shrink:0}
.doc-strip{display:none;align-items:center;gap:8px;padding:6px 4px 10px;font-size:12px;color:var(--t2)}
.doc-strip.show{display:flex}
.ds-icon{color:var(--ac)}.ds-name{font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}.ds-words{color:var(--t3)}
.ds-clr{margin-left:auto;padding:2px 8px;border-radius:6px;font-size:12px;color:var(--t3);transition:all .12s}
.ds-clr:hover{background:var(--g2);color:var(--t1)}
.input-wrap{display:flex;align-items:flex-end;gap:7px;background:var(--g2);border:1px solid var(--gb2);border-radius:var(--r);padding:10px 10px 10px 16px;transition:border-color .18s,box-shadow .18s}
.input-wrap:focus-within{border-color:rgba(237,174,73,.3);box-shadow:0 0 0 1px rgba(237,174,73,.07)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-family:var(--fb);font-size:14px;line-height:1.5;resize:none;max-height:140px;overflow-y:auto}
.input-wrap textarea::placeholder{color:var(--t3)}
.ibtn{width:34px;height:34px;border-radius:9px;color:var(--t2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .14s}
.ibtn:hover{background:var(--g3);color:var(--t1)}
.ibtn.has-doc{color:var(--ac);background:var(--ag)}
.send-btn{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.send-btn:hover{opacity:.85;transform:scale(1.06)}
.send-btn:disabled{opacity:.25;cursor:not-allowed;transform:none}
.input-hint{font-size:11.5px;color:var(--t3);text-align:center;margin-top:7px}

/* ══ FAB ══ */
.voice-fab{position:fixed;bottom:28px;right:28px;z-index:150;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(237,174,73,.38);transition:transform .2s,box-shadow .2s;animation:fabB 3.5s ease-in-out infinite}
.voice-fab:hover{transform:scale(1.12);box-shadow:0 6px 36px rgba(237,174,73,.6);animation:none}
.voice-fab.active{background:linear-gradient(135deg,#4ADE80,#22C55E);animation:none}
.voice-fab::before{content:'Call Oracle';position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--g2);border:1px solid var(--gb2);color:var(--t1);font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.voice-fab:hover::before{opacity:1}
@keyframes fabB{0%,100%{box-shadow:0 4px 24px rgba(237,174,73,.38)}50%{box-shadow:0 4px 40px rgba(237,174,73,.6)}}

/* ══ VC POPUP ══ */
.vc-bd{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);backdrop-filter:blur(0px);transition:background .35s,backdrop-filter .35s;pointer-events:none}
.vc-bd.open{background:rgba(3,3,10,.78);backdrop-filter:blur(12px);pointer-events:all}
.vc-pop{position:fixed;top:50%;left:50%;z-index:201;transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s;width:360px;max-width:calc(100vw - 32px);background:rgba(5,5,18,.93);border:1px solid rgba(237,174,73,.22);border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 32px 80px rgba(0,0,0,.8),0 0 60px rgba(237,174,73,.05);display:flex;flex-direction:column;align-items:center;padding:24px 28px 28px;gap:14px}
.vc-pop.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:all}
.vc-hd{width:100%;display:flex;align-items:center;justify-content:space-between}
.vc-logo-t{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ac)}
.vc-tag{font-size:10px;letter-spacing:.14em;color:var(--t3);font-weight:600}
.vc-nm{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.01em;text-align:center}
.vc-mode-t{font-size:11px;letter-spacing:.18em;color:var(--t2);font-weight:600;text-align:center}
.vc-cw{position:relative;width:190px;height:190px;flex-shrink:0}
.vc-cw canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.vc-timer{font-family:'Consolas',monospace;font-size:30px;letter-spacing:.1em;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.vc-timer.active{color:var(--ac)}
.vc-st{font-size:11px;letter-spacing:.2em;color:var(--t2);text-align:center;min-height:16px;transition:color .3s}
.vc-st.listening{color:#4ADE80}.vc-st.processing,.vc-st.speaking{color:var(--ac)}
.vc-tr{width:100%;min-height:44px;max-height:88px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;overflow-y:auto;font-size:13px;color:var(--t2);line-height:1.55;text-align:center}
.vc-tr::-webkit-scrollbar{width:2px}
.vc-tr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:1px}
.vtl{margin-bottom:3px}.vtl:last-child{margin-bottom:0}
.vtl .vw{font-weight:600;margin-right:5px}
.vtl.user .vw{color:var(--t2)}.vtl.ai .vw{color:var(--ac)}
.vtl span{color:var(--t1)}
.vc-ctrls{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:4px}
.vc-cbtn{display:flex;flex-direction:column;align-items:center;gap:7px}
.vc-cbtn button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:var(--t1);display:flex;align-items:center;justify-content:center;transition:all .18s}
.vc-cbtn button:hover{background:rgba(255,255,255,.13)}
.vc-cbtn button.on{background:rgba(237,174,73,.14);color:var(--ac);border-color:rgba(237,174,73,.3)}
.vc-cbtn label{font-size:10px;letter-spacing:.1em;color:var(--t3);font-weight:500;pointer-events:none}
.ecw{display:flex;flex-direction:column;align-items:center;gap:7px}
.ec-btn{width:68px;height:68px;border-radius:50%;background:#E53935;border:none;color:#fff;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 6px 24px rgba(229,57,53,.45)}
.ec-btn:hover{background:#EF5350;transform:scale(1.08)}
.ecw label{font-size:10px;letter-spacing:.1em;color:var(--t3);font-weight:500;pointer-events:none}

/* ══ LIGHT THEME ══ */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#F0F0F8;--g1:rgba(255,255,255,0.7);--g2:rgba(240,240,252,0.75);--g3:rgba(225,225,248,0.8);
    --gb:rgba(0,0,0,0.08);--gb2:rgba(0,0,0,0.12);--t1:#16162A;--t2:#5A5A80;--t3:#9090B8;
  }
}
:root[data-theme="light"] {
  --bg:#F0F0F8;--g1:rgba(255,255,255,0.7);--g2:rgba(240,240,252,0.75);--g3:rgba(225,225,248,0.8);
  --gb:rgba(0,0,0,0.08);--gb2:rgba(0,0,0,0.12);--t1:#16162A;--t2:#5A5A80;--t3:#9090B8;
}

/* ══ MOBILE ══ */
@media (max-width:768px) {
  .app{padding:8px;gap:8px}
  .app-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .avatar-panel{flex-direction:row;padding:12px 14px;gap:12px;align-items:center;border-radius:16px}
  .avatar-panel::after{display:none}
  .orb-wrap{width:72px;height:72px;flex-shrink:0;margin:0;order:-1}
  .orb-glow{display:none}
  .av-info-col{align-items:flex-start;flex:1;min-width:0;gap:5px}
  .av-name{font-size:15px}
  .av-sub,.av-status{font-size:10px}
  .agent-pills{width:auto}
  .hist-label,.hist-list,.upload-area,.doc-badge{display:none!important}
  .voice-fab{bottom:18px;right:18px;width:46px;height:46px}
  .logo-sep,.logo-suite{display:none}
  .messages{padding:14px 14px 8px}
}
</style>

<input type="file" id="fileInput" accept=".md,.txt,.js,.ts,.jsx,.tsx,.py,.java,.go,.rs,.cpp,.c,.cs,.json,.yaml,.yml,.html,.css,.sql,.sh,.pdf" style="display:none">

<div class="aurora" aria-hidden="true">
  <div class="ab ab1"></div><div class="ab ab2"></div><div class="ab ab3"></div>
</div>

<!-- VC POPUP -->
<div class="vc-bd" id="vcBd"></div>
<div class="vc-pop" id="vcPop">
  <div class="vc-hd">
    <div class="vc-logo-t">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L10.5 6H15L11 9.5L12.5 15L8 12L3.5 15L5 9.5L1 6H5.5L8 1Z"/></svg>
      SWIMPLE
    </div>

/* ══ DOC CONTEXT ══ */
const DocCtx={filename:null,raw:null,chunks:[],wordCount:0,
  load(n,t){this.filename=n;this.raw=t;this.wordCount=t.split(/\s+/).filter(Boolean).length;this.chunks=this._split(t);},
  clear(){this.filename=null;this.raw=null;this.chunks=[];this.wordCount=0;},
  loaded(){return!!this.raw;},
  _split(text){const lines=text.split('\n'),chunks=[];let h='Overview',buf=[];for(const l of lines){const m=l.match(/^#{1,4}\s+(.+)/);if(m){if(buf.join('').trim())chunks.push({heading:h,text:buf.join('\n')});h=m[1].trim();buf=[];}else buf.push(l);}if(buf.join('').trim())chunks.push({heading:h,text:buf.join('\n')});return chunks.length?chunks:[{heading:this.filename||'Doc',text}];},
  search(q){const words=q.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>2);if(!words.length)return this.chunks.slice(0,2);return this.chunks.map(c=>({...c,score:words.reduce((s,w)=>s+((c.heading+' '+c.text).toLowerCase().includes(w)?1:0),0)})).sort((a,b)=>b.score-a.score).filter(c=>c.score>0).slice(0,3);},
  summary(){const h=this.chunks.map(c=>c.heading).filter(h=>h!=='Overview').slice(0,6);return h.length?`Sections: ${h.map(x=>`**${x}**`).join(' · ')}`:`${this.wordCount.toLocaleString()} words loaded.`;}
};

/* ══ PERSONALITY ══ */
const JOKES=["Why do programmers prefer dark mode? Because light attracts bugs. 🐛","A SQL query walks into a bar and asks two tables: 'Can I join you?'","There are only 10 types of people: those who understand binary, and those who don't.","Why was the JS developer sad? He didn't know how to `null` his feelings.","How many programmers to change a light bulb? None — that's a hardware problem.","Debugging: being the detective in a crime movie where you're also the murderer.","It works on my machine. Ship my machine. Problem solved.","99 little bugs in the code… 127 little bugs in the code."];
const DATE_Q=["Perfect day to squash that bug you've been ignoring.","A great day to write code — or refactor someone else's.","Another beautiful day to accidentally push to main.","Tech debt doesn't sleep. But you should. After you ship."];
function todayStr(){return new Date().toLocaleDateString('en-ZA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function personality(text){
  const lo=text.toLowerCase().trim();

  if(/joke|funny|make me laugh|humou?r|cheer me up/.test(lo))return JOKES[Math.floor(Math.random()*JOKES.length)];

  if(/what can you do|help|capabilities|how do you work/.test(lo))return "Here's what I do:\n\n**📎 Document analysis** — Upload any code file, ADR, PRD, or spec and I'll analyse it\n\n**◆ Why Oracle** — Answers *why* your codebase is built the way it is\n\n**◈ Ticket Builder** — Converts meeting notes and bug reports into structured dev tickets\n\n**🎙 Voice Call** — Tap ✦ or the mic and talk to me hands-free\n\n**General Q&A** — Architecture, best practices, or just ask for a joke 😄";
  return null;
}

/* ══ AGENTS ══ */
const AGENTS={
  oracle:{name:'Why Oracle',sub:'IT Knowledge Base',badge:'Oracle',placeholder:'Ask about your codebase, or upload a doc…',chips:['What does this document cover?','Why is auth built this way?','Explain the database choice','Tell me a developer joke'],r:{auth:`Authentication lives in \`src/auth/middleware.py\`. The system uses **JWT tokens with a 1-hour expiry**. Refresh tokens are stored in **Redis** — a deliberate call.\n\n**Why Redis?**\nFast O(1) revocation: deleting a key is instant versus a Postgres query on every request. The latency difference matters at scale.`,postgres:`**Postgres was chosen over MongoDB** for two reasons:\n\n1. **Relational data model** — the project has natural joins and foreign-key constraints\n2. **ACID transactions** — billing events need atomicity that MongoDB can't guarantee\n\nMongoDB's aggregation pipeline added 200–400ms overhead per query — not acceptable.`,retry:`- **Auth service:** no retry — failed auth returns immediately (prevents credential-stuffing)\n- **External APIs:** exponential backoff, max 3 retries, starting at 500ms\n- **DB connections:** connection pool with 5-second timeout before failing over`,default:`I'm ready to help with your codebase.\n\n**Tip:** Upload a document (📎) and I'll give you answers grounded in your actual architecture.\n\nOr ask me:\n- "What does this document cover?"\n- "Where does auth happen?"\n- "Tell me a joke" 😄`}},
  ticket:{name:'Ticket Builder',sub:'Notes → Structured Tickets',badge:'Tickets',placeholder:'Paste meeting notes, a bug report, or upload a spec…',chips:['Convert standup notes to tickets','Triage: login fails after reset','Break down this feature request','What tickets are in this doc?'],r:{bug:`**Bug: Login fails after password reset**\n\n**Severity:** High — users are fully locked out\n\n**Steps to reproduce:**\n1. /forgot-password → submit valid email\n2. Click reset link → enter new password\n3. Attempt login → "invalid credentials"\n\n**Acceptance criteria:**\n- [ ] Login succeeds immediately after reset\n- [ ] Existing sessions invalidated on password change\n- [ ] Redis refresh tokens cleared on reset\n- [ ] Regression test added\n\n**Suspected component:** \`src/auth/middleware.py\` · **Owner:** Auth team`,standup:`Converting to **3 sprint tickets**:\n\n---\n\n**Feature: Email validation on signup** — Medium · Frontend\n\n---\n\n**Chore: Redis 6 → 7 migration** — High · Platform\n\n---\n\n**Bug: Dashboard load regression** — High · Data team`,default:`Paste in meeting notes, a bug report, or feature request — or **upload a spec document** (📎) and I'll extract tickets from it.\n\nI apply a severity rubric, flag missing info, and structure each item with acceptance criteria and a suggested owner.`}}
};

/* ══ MAIN CANVAS (avatar panel) ══ */
const MC=$('mainCanvas'),MCS=200,MCDPR=Math.min(window.devicePixelRatio||1,2);
MC.width=MCS*MCDPR;MC.height=MCS*MCDPR;
const mctx=MC.getContext('2d');mctx.scale(MCDPR,MCDPR);
const MCX=MCS/2,MCY=MCS/2;
let mSimP=0;

function setMainState(s){
  mainState=s;avStatus.className='av-status';
  const L={idle:'READY',thinking:'THINKING…',speaking:'SPEAKING',listening:'LISTENING'};
  avStatus.textContent=L[s]||s.toUpperCase();
  if(s==='listening')avStatus.classList.add('listening');
  else if(s==='thinking'||s==='speaking')avStatus.classList.add(s);
}

(function mainDraw(){
  requestAnimationFrame(mainDraw);
  mctx.clearRect(0,0,MCS,MCS);
  const t=performance.now()/1000,isA=mainState!=='idle',isS=mainState==='speaking',isT=mainState==='thinking';
  const r3=86,op3=isA?.42:.16;
  mctx.save();mctx.translate(MCX,MCY);mctx.rotate(t*.16);mctx.setLineDash([2,11]);mctx.strokeStyle=`rgba(237,174,73,${op3})`;mctx.lineWidth=.8;mctx.beginPath();mctx.arc(0,0,r3,0,Math.PI*2);mctx.stroke();
  for(let i=0;i<30;i++){const a=(i/30)*Math.PI*2,lg=i%5===0;mctx.setLineDash([]);mctx.strokeStyle=`rgba(237,174,73,${lg?op3*1.4:op3*.5})`;mctx.lineWidth=lg?1:.5;mctx.beginPath();mctx.moveTo(Math.cos(a)*(r3-(lg?7:2)),Math.sin(a)*(r3-(lg?7:2)));mctx.lineTo(Math.cos(a)*(r3+(lg?7:2)),Math.sin(a)*(r3+(lg?7:2)));mctx.stroke();}
  mctx.restore();
  const r2=66,op2=isA?.58:.20;
  mctx.save();mctx.translate(MCX,MCY);mctx.rotate(-t*.26);mctx.setLineDash([]);mctx.lineWidth=1;
  for(let i=0;i<3;i++){const ss=i*(Math.PI*2/3),alpha=isT?op2*(.5+.5*Math.sin(t*4+i)):op2;mctx.strokeStyle=`rgba(237,174,73,${alpha})`;mctx.beginPath();mctx.arc(0,0,r2,ss,ss+Math.PI*.55);mctx.stroke();}
  mctx.restore();
  const r1=48,op1=isA?.68:.22;
  mctx.save();mctx.translate(MCX,MCY);mctx.rotate(t*.5);mctx.setLineDash([]);mctx.lineWidth=1.3;
  for(let i=0;i<4;i++){mctx.strokeStyle=`rgba(237,174,73,${op1})`;mctx.beginPath();mctx.arc(0,0,r1,i*(Math.PI/2),i*(Math.PI/2)+Math.PI*.36);mctx.stroke();}
  mctx.restore();
  if(isS){mSimP+=.04;for(let i=0;i<48;i++){const angle=(i/48)*Math.PI*2-Math.PI/2,wave=Math.sin(mSimP*3.5+i*.22)*.55+.5,d=Math.sin(mSimP*14+i*.9)*.12;mctx.strokeStyle=`rgba(237,174,73,${.25+.5*wave})`;mctx.lineWidth=1.8;mctx.beginPath();mctx.moveTo(MCX+Math.cos(angle)*52,MCY+Math.sin(angle)*52);mctx.lineTo(MCX+Math.cos(angle)*(52+(wave+d)*22),MCY+Math.sin(angle)*(52+(wave+d)*22));mctx.stroke();}}
  const breathe=1+(isA?.07:.025)*Math.sin(t*(isS?4:1.8)),orbR=32*breathe,intensity=isS?1:isT?.9:isA?.85:.65;
  const glow=mctx.createRadialGradient(MCX,MCY,0,MCX,MCY,orbR*3.2);glow.addColorStop(0,`rgba(237,174,73,${intensity*.16})`);glow.addColorStop(1,'rgba(237,174,73,0)');mctx.beginPath();mctx.arc(MCX,MCY,orbR*3.2,0,Math.PI*2);mctx.fillStyle=glow;mctx.fill();
  const grad=mctx.createRadialGradient(MCX-orbR*.28,MCY-orbR*.28,0,MCX,MCY,orbR);grad.addColorStop(0,`rgba(255,225,150,${intensity})`);grad.addColorStop(.45,`rgba(237,174,73,${intensity*.9})`);grad.addColorStop(1,`rgba(160,90,20,${intensity*.65})`);mctx.beginPath();mctx.arc(MCX,MCY,orbR,0,Math.PI*2);mctx.fillStyle=grad;mctx.fill();
})();

/* ══ TTS ══ */
function speakText(raw){
  if(!synth||!voiceOn)return;
  const clean=raw.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[→•📎◆◈🚀🐛👋🙌]/g,'').replace(/<br>/g,' ').replace(/\s{2,}/g,' ').trim();
  synth.cancel();
  const utt=new SpeechSynthesisUtterance(clean.slice(0,600));utt.lang='en-US';utt.rate=1.05;utt.pitch=1;utt.volume=1;
  const voices=synth.getVoices();const best=voices.find(v=>/Natural|Neural/i.test(v.name)&&v.lang.startsWith('en'))||voices.find(v=>!v.localService&&v.lang==='en-US')||voices.find(v=>v.lang?.startsWith('en-US'));if(best)utt.voice=best;
  utt.onstart=()=>{setMainState('speaking');messages.querySelectorAll('.msg-row.ai .m-av').forEach((a,i,arr)=>{if(i===arr.length-1)a.classList.add('speaking');});};
  utt.onend=utt.onerror=()=>{setMainState('idle');messages.querySelectorAll('.m-av.speaking').forEach(a=>a.classList.remove('speaking'));};
  synth.speak(utt);
}
voiceBtn.addEventListener('click',()=>{voiceOn=!voiceOn;voiceBtn.classList.toggle('on',voiceOn);if(!voiceOn&&synth)synth.cancel();const sb=$('vcSpkBtn');if(sb)sb.classList.toggle('on',voiceOn);});

/* ══ FILE UPLOAD ══ */
function showDocUI(n,wc){dsName.textContent=n;dsWords.textContent=`· ${wc.toLocaleString()} words`;docStrip.classList.add('show');dbName.textContent=n;docBadge.classList.add('show');uploadBtn.classList.add('has-doc');}
function clearDoc(){DocCtx.clear();docStrip.classList.remove('show');docBadge.classList.remove('show');uploadBtn.classList.remove('has-doc');}
async function handleFile(file){
  const MAX=500000;let text='';
  if(file.type==='application/pdf'){if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}try{const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise,parts=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();parts.push(c.items.map(it=>it.str).join(' '));}text=parts.join('\n\n');}catch(e){return sysMsg(`⚠ Could not read PDF: ${e.message}`);}}
  else{try{text=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'utf-8');});}catch(e){return sysMsg(`⚠ Could not read "${file.name}".`);}}
  if(!text.trim())return sysMsg(`⚠ "${file.name}" appears empty.`);
  if(text.length>MAX)text=text.slice(0,MAX)+'\n\n[… truncated …]';
  DocCtx.load(file.name,text);showDocUI(file.name,DocCtx.wordCount);
  sysMsg(`📎 **${file.name}** loaded — ${DocCtx.wordCount.toLocaleString()} words · ${text.split('\n').length.toLocaleString()} lines.\n\n${DocCtx.summary()}\n\nAsk me anything about it, or try "What does this document cover?"`);
}
uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value='';});
dbClr.addEventListener('click',clearDoc);dsClr.addEventListener('click',clearDoc);

/* ══ RESPONSE ROUTER ══ */
function pick(text){
  const p=personality(text);if(p)return p;
  const lo=text.toLowerCase();
  if(DocCtx.loaded()){
    if(/what does this (doc|document|file) (cover|contain|say|include)|summary|overview|summarise|summarize/.test(lo)){const secs=DocCtx.chunks.slice(0,5).map(c=>`**${c.heading}**\n${c.text.trim().slice(0,120)}…`).join('\n\n');return `Here's what **${DocCtx.filename}** covers:\n\n${secs}\n\n> ${DocCtx.wordCount.toLocaleString()} words total. Ask me anything specific.`;}
    const results=DocCtx.search(text);
    if(results.length){const ex=results.map(r=>`**${r.heading}**\n${r.text.trim().slice(0,280)}${r.text.length>280?'…':''}`).join('\n\n---\n\n');return `From **${DocCtx.filename}**:\n\n${ex}\n\n> Based on your uploaded document. Ask a follow-up to dig deeper.`;}
    return `I didn't find a direct match in **${DocCtx.filename}** for that.\n\nTry "What does this document cover?" or rephrase your question. I can also answer general software development questions.`;
  }
  if(agent==='ticket'){if(/bug|fail|error|crash|broken/.test(lo))return AGENTS.ticket.r.bug;if(/standup|sprint|meeting|notes|ticket|story|jira|linear/.test(lo))return AGENTS.ticket.r.standup;return AGENTS.ticket.r.default;}
  if(/auth|login|jwt|token|middleware/.test(lo))return AGENTS.oracle.r.auth;
  if(/postgres|mongo|database|db/.test(lo))return AGENTS.oracle.r.postgres;
  if(/retry|policy|backoff/.test(lo))return AGENTS.oracle.r.retry;
  return AGENTS.oracle.r.default;
}

/* ══ RENDER ══ */
function sysMsg(md){
  const id=uid();msgs.push({role:'system',content:md,id});renderMsg(msgs[msgs.length-1]);
}
function renderMsg(m){
  const isU=m.role==='user',isSys=m.role==='system';
  const div=document.createElement('div');div.className=`msg-row ${m.role}`;div.dataset.id=m.id;
  const av=isU?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M1 11c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`:
    `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L10.5 6H15L11 9.5L12.5 15L8 12L3.5 15L5 9.5L1 6H5.5L8 1Z"/></svg>`;
  div.innerHTML=`<div class="m-av">${av}</div><div class="m-body"><div class="m-bubble" data-bubble>${m.thinking?'<div class="thinking"><span></span><span></span><span></span></div>':(isU?esc(m.content):fmt(m.content))}</div></div>`;
  messages.appendChild(div);scrollB();
}
async function streamText(id,text){
  const row=messages.querySelector(`[data-id="${id}"]`);if(!row)return;
  const bubble=row.querySelector('[data-bubble]');bubble.innerHTML='';await sleep(80);
  const tokens=text.split(/(\s+)/);let built='';
  for(const tok of tokens){built+=tok;bubble.innerHTML=fmt(built)+'<span class="cur"></span>';scrollB();if(tok.trim())await sleep(13+Math.random()*20);}
  bubble.innerHTML=fmt(built);
}
async function sendMsg(text){
  text=text.trim();if(!text||streaming)return;streaming=true;sendBtn.disabled=true;setMainState('thinking');
  const id1=uid();msgs.push({role:'user',content:text,id:id1});renderMsg(msgs[msgs.length-1]);
  const id2=uid();msgs.push({role:'ai',content:'',id:id2,thinking:true});renderMsg(msgs[msgs.length-1]);
  await sleep(!!personality(text)?260:480+Math.random()*360);
  const resp=pick(text);msgs[msgs.length-1].thinking=false;msgs[msgs.length-1].content=resp;
  await streamText(id2,resp);speakText(resp);
  const preview=text.length>36?text.slice(0,36)+'…':text;
  histList.querySelectorAll('.hi').forEach(i=>i.classList.remove('active'));const item=document.createElement('div');item.className='hi active';item.textContent=preview;histList.prepend(item);
  streaming=false;updateSend();
}

/* ══ AUTO GREETING ══ */
async function autoGreet(){
  await sleep(1000);if(msgs.length>0)return;
  const greet="Hey there! 👋 My name is **Swimple** — your personal helper for all your IT needs.\n\nI'm here to help with your codebase questions, document analysis, dev tickets, and more.\n\n**Let's tackle today's tasks!** 🚀";
  const id=uid();msgs.push({role:'ai',content:greet,id});renderMsg(msgs[msgs.length-1]);
  speakText(greet);
}

function updateSend(){sendBtn.disabled=!inputEl.value.trim()||streaming;}
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,140)+'px';updateSend();});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sendBtn.disabled){const t=inputEl.value;inputEl.value='';inputEl.style.height='auto';updateSend();sendMsg(t);}}});
sendBtn.addEventListener('click',()=>{if(!sendBtn.disabled){const t=inputEl.value;inputEl.value='';inputEl.style.height='auto';updateSend();sendMsg(t);}});

/* ══ AGENT SWITCH ══ */
function switchAgent(a){agent=a;msgs=[];app.className=`app mode-${a}`;document.querySelectorAll('.ap').forEach(b=>b.classList.toggle('active',b.dataset.a===a));const cfg=AGENTS[a];avName.textContent=cfg.name;avSub.textContent=cfg.sub;modePill.textContent=cfg.badge;inputEl.placeholder=cfg.placeholder;const n=$('vcNm');if(n)n.textContent=a==='oracle'?'Oracle':'Ticket Builder';const m=$('vcModeT');if(m)m.textContent=a==='oracle'?'ORACLE MODE':'TICKET MODE';msgs=[];autoGreet();}
$('btnOracle').addEventListener('click',()=>switchAgent('oracle'));
$('btnTicket').addEventListener('click',()=>switchAgent('ticket'));
$('newBtn').addEventListener('click',()=>{msgs=[];messages.innerHTML='';autoGreet();});
$('themeBtn').addEventListener('click',()=>{const t=['system','dark','light'];theme=t[(t.indexOf(theme)+1)%3];theme==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',theme);});
histList.addEventListener('click',e=>{const item=e.target.closest('.hi');if(!item)return;histList.querySelectorAll('.hi').forEach(i=>i.classList.remove('active'));item.classList.add('active');});

/* ══ VC POPUP ══ */
const vcBd=$('vcBd'),vcPop=$('vcPop'),vcCanvas=$('vcCanvas'),vcTimer=$('vcTimer'),vcSt=$('vcSt'),vcTr=$('vcTr');
const VC_DPR=Math.min(window.devicePixelRatio||1,2),VC_SZ=190;
vcCanvas.width=VC_SZ*VC_DPR;vcCanvas.height=VC_SZ*VC_DPR;
const vctx=vcCanvas.getContext('2d');vctx.scale(VC_DPR,VC_DPR);
const VX=VC_SZ/2,VY=VC_SZ/2;
let vcOpen=false,vcState='idle',vcMuted=false,vcSecs=0,vcInt=null,vcRaf=null,vcACtx=null,vcAn=null,vcStream=null,vcRec=null,vcSimP=0;
function setVcSt(s){vcState=s;vcSt.className='vc-st';const L={idle:'STANDBY',listening:'LISTENING…',processing:'THINKING…',speaking:'RESPONDING…'};vcSt.textContent=L[s]||s.toUpperCase();if(s==='listening')vcSt.classList.add('listening');if(s==='processing'||s==='speaking')vcSt.classList.add(s);}
function vcDraw(){vcRaf=requestAnimationFrame(vcDraw);vctx.clearRect(0,0,VC_SZ,VC_SZ);const t=performance.now()/1000,isA=vcState!=='idle',isL=vcState==='listening',isSp=vcState==='speaking',isPr=vcState==='processing';const r3=76,op3=isA?.45:.18;vctx.save();vctx.translate(VX,VY);vctx.rotate(t*.18);vctx.setLineDash([2,10]);vctx.strokeStyle=`rgba(237,174,73,${op3})`;vctx.lineWidth=.8;vctx.beginPath();vctx.arc(0,0,r3,0,Math.PI*2);vctx.stroke();for(let i=0;i<30;i++){const a=(i/30)*Math.PI*2,lg=i%5===0;vctx.setLineDash([]);vctx.strokeStyle=`rgba(237,174,73,${lg?op3*1.5:op3*.5})`;vctx.lineWidth=lg?1.1:.5;vctx.beginPath();vctx.moveTo(Math.cos(a)*(r3-(lg?6:2)),Math.sin(a)*(r3-(lg?6:2)));vctx.lineTo(Math.cos(a)*(r3+(lg?6:2)),Math.sin(a)*(r3+(lg?6:2)));vctx.stroke();}vctx.restore();const r2=58,op2=isA?.6:.22;vctx.save();vctx.translate(VX,VY);vctx.rotate(-t*.28);vctx.setLineDash([]);vctx.lineWidth=1;for(let i=0;i<3;i++){const s=i*(Math.PI*2/3),alpha=isPr?op2*(.5+.5*Math.sin(t*4+i)):op2;vctx.strokeStyle=`rgba(237,174,73,${alpha})`;vctx.beginPath();vctx.arc(0,0,r2,s,s+Math.PI*.55);vctx.stroke();}vctx.restore();const r1=42,op1=isA?.7:.25;vctx.save();vctx.translate(VX,VY);vctx.rotate(t*.55);vctx.setLineDash([]);vctx.lineWidth=1.2;for(let i=0;i<4;i++){const alpha=isL?op1*(.6+.4*Math.sin(t*8+i*1.5)):op1;vctx.strokeStyle=`rgba(237,174,73,${alpha})`;vctx.beginPath();vctx.arc(0,0,r1,i*(Math.PI/2),i*(Math.PI/2)+Math.PI*.36);vctx.stroke();}vctx.restore();const wBase=46;if(isL&&vcAn){const fd=new Uint8Array(vcAn.frequencyBinCount);vcAn.getByteFrequencyData(fd);for(let i=0;i<Math.min(48,fd.length);i++){const angle=(i/48)*Math.PI*2-Math.PI/2,norm=fd[i]/255;vctx.strokeStyle=`rgba(237,174,73,${.3+.65*norm})`;vctx.lineWidth=1.8;vctx.beginPath();vctx.moveTo(VX+Math.cos(angle)*wBase,VY+Math.sin(angle)*wBase);vctx.lineTo(VX+Math.cos(angle)*(wBase+norm*26),VY+Math.sin(angle)*(wBase+norm*26));vctx.stroke();}}else if(isSp){vcSimP+=.04;for(let i=0;i<48;i++){const angle=(i/48)*Math.PI*2-Math.PI/2,wave=Math.sin(vcSimP*3.5+i*.22)*.55+.5,d=Math.sin(vcSimP*14+i*.9)*.12;vctx.strokeStyle=`rgba(237,174,73,${.25+.5*wave})`;vctx.lineWidth=1.8;vctx.beginPath();vctx.moveTo(VX+Math.cos(angle)*wBase,VY+Math.sin(angle)*wBase);vctx.lineTo(VX+Math.cos(angle)*(wBase+(wave+d)*20),VY+Math.sin(angle)*(wBase+(wave+d)*20));vctx.stroke();}}const breathe=1+(isL?.07:.03)*Math.sin(t*(isL?4:1.8)),orbR=28*breathe,intensity=isSp?1:isL?.92:isPr?.85:.7;const glow=vctx.createRadialGradient(VX,VY,0,VX,VY,orbR*3);glow.addColorStop(0,`rgba(237,174,73,${intensity*.18})`);glow.addColorStop(1,'rgba(237,174,73,0)');vctx.beginPath();vctx.arc(VX,VY,orbR*3,0,Math.PI*2);vctx.fillStyle=glow;vctx.fill();const grad=vctx.createRadialGradient(VX-orbR*.28,VY-orbR*.28,0,VX,VY,orbR);grad.addColorStop(0,`rgba(255,225,150,${intensity})`);grad.addColorStop(.45,`rgba(237,174,73,${intensity*.9})`);grad.addColorStop(1,`rgba(160,90,20,${intensity*.65})`);vctx.beginPath();vctx.arc(VX,VY,orbR,0,Math.PI*2);vctx.fillStyle=grad;vctx.fill();}
function vcTick(){vcSecs++;const m=String(Math.floor(vcSecs/60)).padStart(2,'0'),s=String(vcSecs%60).padStart(2,'0');vcTimer.textContent=`${m}:${s}`;vcTimer.classList.add('active');}
function vcLine(role,text){const d=document.createElement('div');d.className=`vtl ${role}`;d.innerHTML=`<span class="vw">${role==='user'?'You':'Swimple'}:</span><span>${esc(text)}</span>`;vcTr.appendChild(d);vcTr.scrollTop=vcTr.scrollHeight;}
async function vcInitAudio(){if(vcACtx)return true;try{vcStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});vcACtx=new AudioContext();vcAn=vcACtx.createAnalyser();vcAn.fftSize=128;vcAn.smoothingTimeConstant=.78;vcACtx.createMediaStreamSource(vcStream).connect(vcAn);return true;}catch(e){vcLine('ai','⚠ Mic access denied.');return false;}}
function vcBuildRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.continuous=false;r.interimResults=true;r.lang='en-US';let interim='';r.onresult=e=>{let f='',i='';for(let j=e.resultIndex;j<e.results.length;j++){e.results[j].isFinal?(f+=e.results[j][0].transcript):(i+=e.results[j][0].transcript);}interim=(f||i).trim();};r.onend=async()=>{const q=interim;interim='';if(!q||!vcOpen){if(vcOpen)setVcSt('listening');return;}vcLine('user',q);setVcSt('processing');await sleep(400+Math.random()*350);const resp=pick(q);const clean=resp.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[📎◆◈🚀🐛👋🙌]/g,'').replace(/\n/g,' ').trim().slice(0,200)+(resp.length>200?'…':'');vcLine('ai',clean);setVcSt('speaking');sendMsg(q);if(voiceOn){synth.cancel();const utt=new SpeechSynthesisUtterance(resp.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[📎◆◈🚀🐛👋🙌]/g,'').replace(/\s{2,}/g,' ').trim().slice(0,500));utt.lang='en-US';utt.rate=1.05;const voices=synth.getVoices();const best=voices.find(v=>/Natural|Neural/i.test(v.name)&&v.lang.startsWith('en'))||voices.find(v=>!v.localService&&v.lang==='en-US')||voices.find(v=>v.lang?.startsWith('en-US'));if(best)utt.voice=best;utt.onend=utt.onerror=()=>{if(vcOpen){setVcSt('listening');vcStartListen();}};synth.speak(utt);}else{await sleep(1500);if(vcOpen){setVcSt('listening');vcStartListen();}}};r.onerror=e=>{if(e.error!=='no-speech'&&vcOpen)vcLine('ai',`⚠ ${e.error}`);if(vcOpen)setVcSt('listening');};return r;}
function vcStartListen(){if(!vcOpen||vcMuted)return;if(!vcRec)vcRec=vcBuildRec();if(!vcRec){vcLine('ai','⚠ Needs Chrome or Edge.');return;}try{vcRec.start();}catch(_){}}
async function openCall(){if(vcOpen)return;vcOpen=true;vcBd.classList.add('open');vcPop.classList.add('open');$('voiceFab').classList.add('active');vcTr.innerHTML='';vcLine('ai','Connected. Ask me anything.');vcSecs=0;vcTimer.textContent='00:00';vcTimer.classList.remove('active');vcInt=setInterval(vcTick,1000);setVcSt('listening');vcDraw();const ok=await vcInitAudio();if(!ok){setVcSt('idle');return;}if(!window.SpeechRecognition&&!window.webkitSpeechRecognition){vcLine('ai','⚠ Needs Chrome or Edge.');setVcSt('idle');return;}vcStartListen();}
function closeCall(){if(!vcOpen)return;vcOpen=false;try{vcRec?.stop();}catch(_){}vcRec=null;synth?.cancel();clearInterval(vcInt);cancelAnimationFrame(vcRaf);vcRaf=null;vcPop.classList.remove('open');vcBd.classList.remove('open');$('voiceFab').classList.remove('active');setVcSt('idle');}
$('ecBtn').addEventListener('click',closeCall);
vcBd.addEventListener('click',e=>{if(e.target===vcBd)closeCall();});
$('vcMuteBtn').addEventListener('click',()=>{vcMuted=!vcMuted;$('vcMuteBtn').classList.toggle('on',vcMuted);if(vcMuted){try{vcRec?.stop();}catch(_){}}else if(vcState==='listening')vcStartListen();});
$('vcSpkBtn').addEventListener('click',()=>{voiceOn=!voiceOn;$('vcSpkBtn').classList.toggle('on',voiceOn);voiceBtn.classList.toggle('on',voiceOn);if(!voiceOn)synth?.cancel();});
$('micBtn').addEventListener('click',openCall);
$('voiceFab').addEventListener('click',openCall);
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&vcOpen){e.preventDefault();closeCall();}});

/* ══ BOOT ══ */
if(synth)synth.getVoices();
window.addEventListener('load',autoGreet);
