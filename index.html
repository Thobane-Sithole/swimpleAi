<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Swimple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ══ ROOT ══ */
:root {
  --bg: #08081A;
  --ac: #EDAE49; --ac2: #F47B3C;
  --ag: rgba(237,174,73,0.12); --ag2: rgba(237,174,73,0.05);
  --t1: #F0F2FF; --t2: #7070A0; --t3: #3A3A60;
  --gb: rgba(255,255,255,0.10); --gb2: rgba(255,255,255,0.16);
  --lg-bg: rgba(10,10,32,0.32);
  --lg-hi: rgba(255,255,255,0.65);
  --fd: 'Orbitron',system-ui,sans-serif;
  --fb: 'Rajdhani',system-ui,sans-serif;
  --fm: 'DM Sans',system-ui,sans-serif;
  --r: 20px; --rm: 14px; --rs: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--fb);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--fm);cursor:pointer;border:none;background:transparent}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ══ APPLE LIQUID GLASS SYSTEM ══ */
.gc{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5),0 0 0 1px var(--gb)}
.gf{position:absolute;inset:0;backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);filter:url(#lensFilter);z-index:1}
.go{position:absolute;inset:0;background:var(--lg-bg);z-index:2}
.gs{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 1px 1px 0 var(--lg-hi),inset 0 0 6px rgba(255,255,255,0.03);z-index:3;pointer-events:none}
.gx{position:relative;z-index:4}

/* ══ BACKGROUND ══ */
.bg-full{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 110% 70% at 25% 0%,rgba(14,8,38,1) 0%,var(--bg) 100%)}
.bg-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:orbF 24s ease-in-out infinite}
.orb1{width:60vw;height:60vw;background:radial-gradient(circle,rgba(237,174,73,0.12),transparent 70%);top:-20%;left:-10%}
.orb2{width:50vw;height:60vw;background:radial-gradient(circle,rgba(91,143,255,0.10),transparent 70%);bottom:-20%;right:-5%;animation-delay:-9s}
.orb3{width:40vw;height:45vw;background:radial-gradient(circle,rgba(38,198,218,0.07),transparent 70%);top:30%;left:38%;animation-delay:-18s}
@keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-60px) scale(1.08)}66%{transform:translate(-30px,40px) scale(0.94)}}

/* Three.js canvas */
#threeCanvas{position:absolute;inset:0;width:100%;height:100%}

/* Orb canvas fallback */
#orbCanvas{position:absolute;top:50%;left:40%;transform:translate(-50%,-50%);pointer-events:none}

/* Avatar loading */
#avLoad{position:absolute;top:50%;left:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--t2);font-size:13px}
.spin{width:32px;height:32px;border:2px solid var(--t3);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Avatar info block (bottom of avatar area) */
.av-info{position:fixed;bottom:32px;left:calc(50% - 250px);transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
.av-name-lbl{font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:0.06em;text-shadow:0 0 24px rgba(237,174,73,0.5),0 2px 16px rgba(0,0,0,0.9);text-transform:uppercase}
.av-sub-lbl{font-family:var(--fd);font-size:9px;color:var(--t2);letter-spacing:0.28em;font-weight:600;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,0.7);margin-top:4px}
.av-status-lbl{font-family:var(--fd);font-size:8.5px;letter-spacing:0.3em;font-weight:700;color:var(--t3);transition:color 0.3s;text-shadow:0 1px 6px rgba(0,0,0,0.8);margin-top:6px}
.av-status-lbl.listening{color:#4ADE80}
.av-status-lbl.speaking,.av-status-lbl.thinking{color:var(--ac)}

/* ══ FLOATING HEADER ══ */
.hdr{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;width:calc(100% - 40px);max-width:840px}
.hdr .gc{border-radius:100px}
.hdr .gs{border-radius:100px}
.hdr-c{display:flex;align-items:center;padding:10px 18px;gap:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo-gem{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:12px;color:#000;font-weight:900;transition:background .3s}
.logo-name{font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:0.08em;text-transform:uppercase}
.logo-sep{width:1px;height:16px;background:var(--gb2);margin:0 2px}
.logo-suite{font-size:10px;color:var(--t2);letter-spacing:0.12em;font-weight:600;text-transform:uppercase}
.hdr-mid{flex:1;display:flex;justify-content:center}
.mode-pill{padding:4px 14px;border-radius:100px;font-family:var(--fd);font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;background:var(--ag);color:var(--ac);border:1px solid rgba(237,174,73,0.22)}
.hdr-r{display:flex;align-items:center;gap:5px}
.gbtn{width:34px;height:34px;border-radius:var(--rm);background:rgba(255,255,255,0.07);backdrop-filter:blur(4px);box-shadow:inset 1px 1px 0 var(--lg-hi);color:var(--t2);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:13px}
.gbtn:hover{color:var(--t1);background:rgba(255,255,255,0.13)}
.gbtn.on{color:var(--ac);background:var(--ag)}
.hdr-new{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:100px;font-size:12px;font-weight:600;background:rgba(255,255,255,0.07);color:var(--t2);box-shadow:inset 1px 1px 0 var(--lg-hi);transition:all .15s}
.hdr-new:hover{color:var(--t1);background:rgba(255,255,255,0.13)}

/* ══ HOLOGRAM CHAT PANEL ══ */
.holo{position:fixed;top:82px;right:20px;width:420px;height:calc(100vh - 102px);z-index:50;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .3s}
.holo.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.pc{height:100%;border-radius:var(--r) !important}
.panel-body{display:flex;flex-direction:column;height:100%}

/* Panel header */
.ph{display:flex;align-items:center;gap:7px;padding:11px 15px;border-bottom:1px solid var(--gb);flex-shrink:0}
.ph-info{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.ph-name{font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-status{font-family:var(--fd);font-size:8px;letter-spacing:0.28em;font-weight:700;color:var(--t3);transition:color .3s;text-transform:uppercase}
.ph-status.listening{color:#4ADE80}
.ph-status.speaking,.ph-status.thinking{color:var(--ac)}
.agent-pills{display:flex;gap:4px}
.ap{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--t2);transition:all .15s}
.ap.active{background:var(--ag);color:var(--ac)}
.ap:not(.active):hover{background:rgba(255,255,255,0.06);color:var(--t1)}
.pcl{width:26px;height:26px;border-radius:6px;color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;background:rgba(255,255,255,0.05)}
.pcl:hover{color:var(--t1);background:rgba(255,255,255,0.10)}

/* Upload strip */
.doc-badge{display:none;align-items:center;gap:6px;padding:5px 10px;margin:8px 14px 0;border-radius:var(--rs);background:var(--ag2);border:1px solid rgba(237,174,73,.18);font-size:12px;color:var(--ac)}
.doc-badge.show{display:flex}
.db-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.db-clr{color:var(--t3);font-size:15px;transition:color .12s}
.db-clr:hover{color:var(--t1)}
.upload-area{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;margin:6px 14px 0;border-radius:var(--rs);border:1px dashed rgba(237,174,73,.2);color:var(--t2);font-size:12px;cursor:pointer;transition:all .15s;background:var(--ag2)}
.upload-area:hover{border-color:rgba(237,174,73,.45);color:var(--t1);background:var(--ag)}
.upload-area svg{color:var(--ac);flex-shrink:0}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--gb);border-radius:2px}

/* Message rows */
.msg-row{display:flex;padding:4px 0;gap:8px;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg-row.user{flex-direction:row-reverse}
.m-av{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:3px;position:relative}
.msg-row.ai .m-av,.msg-row.system .m-av{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;transition:background .3s}
.msg-row.user .m-av{background:rgba(255,255,255,0.08);color:var(--t2)}
.m-av.speaking::after{content:'';position:absolute;inset:-5px;border-radius:11px;border:1.5px solid var(--ac);animation:avRing 1.1s ease-out infinite}
@keyframes avRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.m-body{max-width:min(310px,80%);display:flex;flex-direction:column;gap:2px}
.msg-row.user .m-body{align-items:flex-end}
.msg-row.system .m-body{max-width:100%;width:100%}
.m-bubble{padding:10px 13px;border-radius:var(--r);font-size:13.5px;line-height:1.65}
.msg-row.user .m-bubble{background:rgba(255,255,255,0.08);border:1px solid var(--gb);border-radius:var(--r) var(--r) 5px var(--r)}
.msg-row.ai .m-bubble{padding:4px 2px}
.msg-row.system .m-bubble{background:var(--ag2);border:1px solid rgba(237,174,73,.14);border-radius:var(--rs);font-size:12.5px;color:var(--t2);padding:9px 13px}
.thinking{display:flex;gap:5px;padding:12px 2px;align-items:center}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--ac);opacity:.4;animation:tdot 1.3s ease-in-out infinite}
.thinking span:nth-child(2){animation-delay:.18s}.thinking span:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac);margin-left:1px;vertical-align:text-bottom;animation:cblink .75s step-end infinite}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
.m-bubble strong{color:var(--ac);font-weight:600}
.m-bubble code{font-family:'Consolas','Monaco',monospace;font-size:.87em;background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:4px}
.m-bubble pre{background:rgba(0,0,0,.3);border:1px solid var(--gb);border-radius:var(--rs);padding:10px 12px;overflow-x:auto;font-family:'Consolas','Monaco',monospace;font-size:12px;line-height:1.5;margin:7px 0}
.m-bubble .divline{height:1px;background:var(--gb);margin:8px 0}
.m-bubble .warn{font-size:12.5px;color:var(--t2);margin-top:7px;padding:7px 11px;background:var(--ag2);border-radius:var(--rs);border-left:2px solid var(--ac)}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:20px;text-align:center}
.empty-title{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;background:linear-gradient(135deg,var(--t1) 20%,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty-sub{font-size:13px;color:var(--t2);max-width:270px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.chip{padding:6px 13px;border-radius:100px;border:1px solid var(--gb2);background:rgba(255,255,255,0.04);color:var(--t2);font-size:12px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ac);color:var(--t1);background:var(--ag)}

/* Input area */
.input-area{padding:8px 12px 12px;flex-shrink:0}
.doc-strip{display:none;align-items:center;gap:7px;padding:5px 3px 8px;font-size:12px;color:var(--t2)}
.doc-strip.show{display:flex}
.ds-icon{color:var(--ac)}.ds-name{font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}.ds-words{color:var(--t3)}
.ds-clr{margin-left:auto;padding:2px 7px;border-radius:6px;font-size:12px;color:var(--t3);transition:all .12s}
.ds-clr:hover{background:rgba(255,255,255,.06);color:var(--t1)}
.input-wrap{display:flex;align-items:flex-end;gap:6px;background:rgba(255,255,255,0.07);backdrop-filter:blur(4px);border-radius:var(--r);padding:7px;box-shadow:inset 1px 1px 0 var(--lg-hi);transition:box-shadow .18s}
.input-wrap:focus-within{box-shadow:inset 1px 1px 0 var(--lg-hi),0 0 0 1px rgba(237,174,73,.25)}
.input-wrap textarea{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-family:var(--fb);font-size:13.5px;line-height:1.5;resize:none;max-height:120px;padding:8px 4px;overflow-y:auto}
.input-wrap textarea::placeholder{color:var(--t3)}
.ibtn{width:32px;height:32px;border-radius:8px;color:var(--t2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .14s;background:rgba(255,255,255,0.06);box-shadow:inset 1px 1px 0 rgba(255,255,255,0.2)}
.ibtn:hover{background:rgba(255,255,255,.12);color:var(--t1)}
.ibtn.has-doc{color:var(--ac);background:var(--ag)}
.send-btn{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.send-btn:hover{opacity:.85;transform:scale(1.06)}
.send-btn:disabled{opacity:.25;cursor:not-allowed;transform:none}
.input-hint{font-size:11px;color:var(--t3);text-align:center;margin-top:5px}

/* ══ VOICE FAB ══ */
.voice-fab{position:fixed;bottom:28px;left:24px;z-index:150;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(237,174,73,.5);transition:transform .2s,box-shadow .2s;animation:fabB 3.5s ease-in-out infinite}
.voice-fab:hover{transform:scale(1.1);box-shadow:0 6px 32px rgba(237,174,73,.7);animation:none}
.voice-fab.active{background:linear-gradient(135deg,#4ADE80,#22C55E);animation:none}
@keyframes fabB{0%,100%{box-shadow:0 4px 20px rgba(237,174,73,.5)}50%{box-shadow:0 4px 36px rgba(237,174,73,.75)}}

/* ══ VC POPUP ══ */
.vc-bd{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);backdrop-filter:blur(0px);transition:background .35s,backdrop-filter .35s;pointer-events:none}
.vc-bd.open{background:rgba(3,3,10,.78);backdrop-filter:blur(12px);pointer-events:all}
.vc-pop{position:fixed;top:50%;left:50%;z-index:201;transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .3s;width:360px;max-width:calc(100vw - 32px);background:rgba(5,5,18,.93);border:1px solid rgba(237,174,73,.22);border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 32px 80px rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;padding:24px 28px 28px;gap:14px}
.vc-pop.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:all}
.vc-hd{width:100%;display:flex;align-items:center;justify-content:space-between}
.vc-logo-t{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--ac)}
.vc-tag{font-size:10px;letter-spacing:.14em;color:var(--t3);font-weight:600}
.vc-nm{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.01em;text-align:center}
.vc-mode-t{font-size:11px;letter-spacing:.18em;color:var(--t2);font-weight:600;text-align:center}
.vc-cw{position:relative;width:190px;height:190px;flex-shrink:0}
.vc-cw canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.vc-timer{font-family:'Consolas',monospace;font-size:30px;letter-spacing:.1em;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.vc-timer.active{color:var(--ac)}
.vc-st{font-size:11px;letter-spacing:.2em;color:var(--t2);text-align:center;min-height:16px;transition:color .3s}
.vc-st.listening{color:#4ADE80}.vc-st.processing,.vc-st.speaking{color:var(--ac)}
.vc-tr{width:100%;min-height:44px;max-height:88px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;overflow-y:auto;font-size:13px;color:var(--t2);line-height:1.55;text-align:center}
.vc-tr::-webkit-scrollbar{width:2px}.vc-tr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:1px}
.vtl{margin-bottom:3px}.vtl:last-child{margin-bottom:0}
.vtl .vw{font-weight:600;margin-right:5px}.vtl.user .vw{color:var(--t2)}.vtl.ai .vw{color:var(--ac)}
.vtl span{color:var(--t1)}
.vc-ctrls{display:flex;align-items:center;justify-content:center;gap:32px;margin-top:4px}
.vc-cbtn{display:flex;flex-direction:column;align-items:center;gap:7px}
.vc-cbtn button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);color:var(--t1);display:flex;align-items:center;justify-content:center;transition:all .18s}
.vc-cbtn button:hover{background:rgba(255,255,255,.13)}
.vc-cbtn button.on{background:rgba(237,174,73,.14);color:var(--ac);border-color:rgba(237,174,73,.3)}
.vc-cbtn label{font-size:10px;letter-spacing:.1em;color:var(--t3);font-weight:500;pointer-events:none}
.ecw{display:flex;flex-direction:column;align-items:center;gap:7px}
.ec-btn{width:68px;height:68px;border-radius:50%;background:#E53935;border:none;color:#fff;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:0 6px 24px rgba(229,57,53,.45)}
.ec-btn:hover{background:#EF5350;transform:scale(1.08)}
.ecw label{font-size:10px;letter-spacing:.1em;color:var(--t3);font-weight:500;pointer-events:none}

/* ══ LIGHT THEME ══ */
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF0F8;--lg-bg:rgba(240,242,255,0.38);--t1:#16162A;--t2:#5A5A80;--t3:#9090B8;--gb:rgba(0,0,0,0.08);--gb2:rgba(0,0,0,0.14)}}
:root[data-theme="light"]{--bg:#EEF0F8;--lg-bg:rgba(240,242,255,0.38);--t1:#16162A;--t2:#5A5A80;--t3:#9090B8;--gb:rgba(0,0,0,0.08);--gb2:rgba(0,0,0,0.14)}

/* ══ MOBILE ══ */
@media(max-width:768px){
  .hdr{top:10px;width:calc(100% - 20px)}
  .hdr-c{padding:8px 14px}
  .logo-sep,.logo-suite{display:none}
  .hdr-new span{display:none}

  .holo{top:auto;right:0;bottom:0;left:0;width:100%;height:58vh;border-radius:var(--r) var(--r) 0 0 !important}
  .holo.hide{transform:translateY(100%)}
  .pc{border-radius:var(--r) var(--r) 0 0 !important}
  .gc.pc{border-radius:var(--r) var(--r) 0 0 !important}

  .av-info{left:50%;transform:translateX(-50%);bottom:calc(58vh + 16px)}
  .voice-fab{left:24px;bottom:calc(58vh + 20px)}

  #orbCanvas{left:50%;top:45%}
  #avLoad{left:50%;top:45%}
}
@media(max-width:480px){
  .holo{height:65vh}
  .av-info{bottom:calc(65vh + 14px)}
  .voice-fab{bottom:calc(65vh + 14px)}
}
</style>
</head>

<!-- ════════════ THREE.JS AVATAR (Module) ════════════ -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
camera.position.set(0, 1.55, 3.2);
camera.lookAt(0, 1.1, 0);

// Lighting (warm + cool fills)
const ambient = new THREE.AmbientLight(0xffd4a0, 0.7);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffeedd, 2.2);
key.position.set(1.5, 3, 2);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0xaac8ff, 0.8);
fill.position.set(-2, 2, 1);
scene.add(fill);
const back = new THREE.DirectionalLight(0xffd080, 0.4);
back.position.set(0, 1, -3);
scene.add(back);

// Resize handler
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// Avatar state — exposed globally
let avatarMixer = null;
let morphMesh = null;
let jawMorphIdx = -1;
let avatarLoaded = false;
let currentState = 'idle';
let lipPhase = 0;
let breathePhase = 0;

window.setAvatarState = function(s) {
  currentState = s;
};

// Load GLB
const loader = new GLTFLoader();
loader.load('./avatar/swimple_avatar.glb',
  (gltf) => {
    const model = gltf.scene;

    // Auto-scale and center
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 1.8 / maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));
    model.position.y += 0.05;

    scene.add(model);

    // Find mesh with morph targets for lip sync
    model.traverse(node => {
      if (node.isMesh && node.morphTargetDictionary && !morphMesh) {
        morphMesh = node;
        const dict = node.morphTargetDictionary;
        // Try common jaw/mouth morph target names
        const candidates = ['jawOpen','mouthOpen','Mouth_Open','mouth_open','viseme_aa','JawOpen','jaw_open','A'];
        for (const name of candidates) {
          if (name in dict) { jawMorphIdx = dict[name]; break; }
        }
      }
    });

    if (gltf.animations?.length) {
      avatarMixer = new THREE.AnimationMixer(model);
      const idle = gltf.animations.find(a => /idle|stand|breath/i.test(a.name)) || gltf.animations[0];
      if (idle) avatarMixer.clipAction(idle).play();
    }

    avatarLoaded = true;
    document.getElementById('avLoad').style.display = 'none';
    document.getElementById('orbCanvas').style.display = 'none';
  },
  (progress) => {
    if (progress.total > 0) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      const el = document.getElementById('avLoad');
      if (el) el.querySelector('span').textContent = `Loading avatar… ${pct}%`;
    }
  },
  (err) => {
    console.warn('Avatar load failed, using orb fallback:', err);
    document.getElementById('avLoad').style.display = 'none';
    // Orb canvas stays visible as fallback
  }
);

// Render loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (avatarMixer) avatarMixer.update(dt);

  // Lip sync animation
  if (morphMesh && jawMorphIdx >= 0) {
    let target = 0;
    if (currentState === 'speaking') {
      lipPhase += dt * 8;
      target = Math.max(0, Math.sin(lipPhase) * 0.5 + Math.sin(lipPhase * 2.3) * 0.25);
    } else if (currentState === 'listening') {
      target = 0.05 + Math.sin(t * 3) * 0.05;
    }
    const current = morphMesh.morphTargetInfluences[jawMorphIdx] || 0;
    morphMesh.morphTargetInfluences[jawMorphIdx] = THREE.MathUtils.lerp(current, Math.max(0, Math.min(1, target)), 0.18);
  }

  // Subtle camera drift (idle breathing)
  breathePhase += dt * 0.5;
  const breathe = Math.sin(breathePhase) * 0.004;
  camera.position.y = 1.55 + breathe;

  renderer.render(scene, camera);
}
animate();
</script>

<!-- ════════════ ORB CANVAS FALLBACK (always animated) ════════════ -->
<script>
(function(){
const OC=document.getElementById('orbCanvas');
const OS=220,ODPR=Math.min(window.devicePixelRatio||1,2);
OC.width=OS*ODPR;OC.height=OS*ODPR;OC.style.width=OS+'px';OC.style.height=OS+'px';
const octx=OC.getContext('2d');octx.scale(ODPR,ODPR);
const OCX=OS/2,OCY=OS/2;
let orbSimP=0;

function drawOrb(){
  requestAnimationFrame(drawOrb);
  octx.clearRect(0,0,OS,OS);
  const t=performance.now()/1000;
  const state=window._swimpleState||'idle';
  const isA=state!=='idle',isS=state==='speaking',isT=state==='thinking';

  const r3=86,op3=isA?.42:.16;
  octx.save();octx.translate(OCX,OCY);octx.rotate(t*.16);octx.setLineDash([2,11]);
  octx.strokeStyle=`rgba(237,174,73,${op3})`;octx.lineWidth=.8;
  octx.beginPath();octx.arc(0,0,r3,0,Math.PI*2);octx.stroke();
  for(let i=0;i<30;i++){const a=(i/30)*Math.PI*2,lg=i%5===0;octx.setLineDash([]);octx.strokeStyle=`rgba(237,174,73,${lg?op3*1.4:op3*.5})`;octx.lineWidth=lg?1:.5;octx.beginPath();octx.moveTo(Math.cos(a)*(r3-(lg?7:2)),Math.sin(a)*(r3-(lg?7:2)));octx.lineTo(Math.cos(a)*(r3+(lg?7:2)),Math.sin(a)*(r3+(lg?7:2)));octx.stroke();}
  octx.restore();

  const r2=66,op2=isA?.58:.20;
  octx.save();octx.translate(OCX,OCY);octx.rotate(-t*.26);octx.setLineDash([]);octx.lineWidth=1;
  for(let i=0;i<3;i++){const ss=i*(Math.PI*2/3),alpha=isT?op2*(.5+.5*Math.sin(t*4+i)):op2;octx.strokeStyle=`rgba(237,174,73,${alpha})`;octx.beginPath();octx.arc(0,0,r2,ss,ss+Math.PI*.55);octx.stroke();}
  octx.restore();

  const r1=48,op1=isA?.68:.22;
  octx.save();octx.translate(OCX,OCY);octx.rotate(t*.5);octx.setLineDash([]);octx.lineWidth=1.3;
  for(let i=0;i<4;i++){octx.strokeStyle=`rgba(237,174,73,${op1})`;octx.beginPath();octx.arc(0,0,r1,i*(Math.PI/2),i*(Math.PI/2)+Math.PI*.36);octx.stroke();}
  octx.restore();

  if(isS){orbSimP+=.04;for(let i=0;i<48;i++){const angle=(i/48)*Math.PI*2-Math.PI/2,wave=Math.sin(orbSimP*3.5+i*.22)*.55+.5,d=Math.sin(orbSimP*14+i*.9)*.12;octx.strokeStyle=`rgba(237,174,73,${.25+.5*wave})`;octx.lineWidth=1.8;octx.beginPath();octx.moveTo(OCX+Math.cos(angle)*52,OCY+Math.sin(angle)*52);octx.lineTo(OCX+Math.cos(angle)*(52+(wave+d)*22),OCY+Math.sin(angle)*(52+(wave+d)*22));octx.stroke();}}

  const breathe=1+(isA?.07:.025)*Math.sin(t*(isS?4:1.8)),orbR=32*breathe,intensity=isS?1:isT?.9:isA?.85:.65;
  const glow=octx.createRadialGradient(OCX,OCY,0,OCX,OCY,orbR*3.2);glow.addColorStop(0,`rgba(237,174,73,${intensity*.16})`);glow.addColorStop(1,'rgba(237,174,73,0)');octx.beginPath();octx.arc(OCX,OCY,orbR*3.2,0,Math.PI*2);octx.fillStyle=glow;octx.fill();
  const grad=octx.createRadialGradient(OCX-orbR*.28,OCY-orbR*.28,0,OCX,OCY,orbR);grad.addColorStop(0,`rgba(255,225,150,${intensity})`);grad.addColorStop(.45,`rgba(237,174,73,${intensity*.9})`);grad.addColorStop(1,`rgba(160,90,20,${intensity*.65})`);octx.beginPath();octx.arc(OCX,OCY,orbR,0,Math.PI*2);octx.fillStyle=grad;octx.fill();
}
drawOrb();
})();
</script>

<script>
/* ══ DOC CONTEXT ══ */
const DocCtx={filename:null,raw:null,chunks:[],wordCount:0,
  load(n,t){this.filename=n;this.raw=t;this.wordCount=t.split(/\s+/).filter(Boolean).length;this.chunks=this._split(t);},
  clear(){this.filename=null;this.raw=null;this.chunks=[];this.wordCount=0;},
  loaded(){return!!this.raw;},
  _split(text){const lines=text.split('\n'),chunks=[];let h='Overview',buf=[];for(const l of lines){const m=l.match(/^#{1,4}\s+(.+)/);if(m){if(buf.join('').trim())chunks.push({heading:h,text:buf.join('\n')});h=m[1].trim();buf=[];}else buf.push(l);}if(buf.join('').trim())chunks.push({heading:h,text:buf.join('\n')});return chunks.length?chunks:[{heading:this.filename||'Doc',text}];},
  search(q){const words=q.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>2);if(!words.length)return this.chunks.slice(0,2);return this.chunks.map(c=>({...c,score:words.reduce((s,w)=>s+((c.heading+' '+c.text).toLowerCase().includes(w)?1:0),0)})).sort((a,b)=>b.score-a.score).filter(c=>c.score>0).slice(0,3);},
  summary(){const h=this.chunks.map(c=>c.heading).filter(h=>h!=='Overview').slice(0,6);return h.length?`Sections: ${h.map(x=>`**${x}**`).join(' · ')}`:`${this.wordCount.toLocaleString()} words loaded.`;}
};

/* ══ PERSONALITY ══ */
const JOKES=["Why do programmers prefer dark mode? Because light attracts bugs. 🐛","A SQL query walks into a bar and asks two tables: 'Can I join you?'","There are only 10 types of people: those who understand binary, and those who don't.","Why was the JS developer sad? He didn't know how to `null` his feelings.","How many programmers to change a light bulb? None — that's a hardware problem.","Debugging: being the detective in a crime movie where you're also the murderer.","It works on my machine. Ship my machine. Problem solved.","99 little bugs in the code… 127 little bugs in the code."];

function todayStr(){return new Date().toLocaleDateString('en-ZA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function personality(text){

let currentAudio=null;
const GROQ_VOICE='autumn';

function stopSpeaking(){
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  if(synth)synth.cancel();
  setMainState('idle');
  messages.querySelectorAll('.m-av.speaking').forEach(a=>a.classList.remove('speaking'));
}

function markSpeaking(){
  setMainState('speaking');
  messages.querySelectorAll('.msg-row.ai .m-av').forEach((a,i,arr)=>{if(i===arr.length-1)a.classList.add('speaking');});
}

function bestVoice(){
  const voices=synth.getVoices();
  const ranked=[
    v=>/microsoft.*aria|aria.*neural/i.test(v.name),
    v=>/microsoft.*jenny|jenny.*neural/i.test(v.name),
    v=>/microsoft.*guy|guy.*neural/i.test(v.name),
    v=>/microsoft.*natural/i.test(v.name)&&v.lang.startsWith('en'),
    v=>/microsoft/i.test(v.name)&&!v.localService&&v.lang.startsWith('en'),
    v=>/google/i.test(v.name)&&v.lang==='en-US',
    v=>!v.localService&&v.lang==='en-US',
    v=>v.lang==='en-US',
    v=>v.lang.startsWith('en'),
  ];
  for(const t of ranked){const v=voices.find(t);if(v)return v;}
  return null;
}

function speakFallback(raw){
  if(!synth)return;
  const voices=synth.getVoices();
  // Only allow voices explicitly tagged as English — never fall through to system default
  const enVoice=voices.find(v=>/microsoft.*aria|aria.*neural/i.test(v.name))
    ||voices.find(v=>/microsoft.*jenny|jenny.*neural/i.test(v.name))
    ||voices.find(v=>/microsoft.*natural/i.test(v.name)&&/en[-_]/i.test(v.lang))
    ||voices.find(v=>/google/i.test(v.name)&&v.lang==='en-US')
    ||voices.find(v=>v.lang==='en-US')
    ||voices.find(v=>/^en[-_]/i.test(v.lang));
  if(!enVoice){console.warn('No English TTS voice found on this device — Groq TTS required.');return;}
  const clean=raw.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[→•📎◆◈🚀🐛👋🙌]/g,'').replace(/<br>/g,' ').replace(/\s{2,}/g,' ').trim();
  const utt=new SpeechSynthesisUtterance(clean.slice(0,600));
  utt.lang='en-US';utt.rate=0.97;utt.pitch=1;utt.volume=1;
  utt.voice=enVoice;
  utt.onstart=markSpeaking;
  utt.onend=utt.onerror=()=>{setMainState('idle');messages.querySelectorAll('.m-av.speaking').forEach(a=>a.classList.remove('speaking'));};
  synth.speak(utt);
}

async function speakText(raw){
  if(!voiceOn)return;
  stopSpeaking();
  const clean=raw.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[→•📎◆◈🚀🐛👋🙌]/g,'').replace(/<br>/g,' ').replace(/\s{2,}/g,' ').trim();
  // Try Groq Orpheus when served over HTTP
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{
      markSpeaking();
      const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,voice:GROQ_VOICE})});
      if(!res.ok)throw new Error(`HTTP ${res.status}: ${await res.text()}`);
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const audio=new Audio(url);
      currentAudio=audio;
      setVoiceTag('ORPHEUS','green');
      audio.onended=()=>{URL.revokeObjectURL(url);currentAudio=null;setMainState('idle');messages.querySelectorAll('.m-av.speaking').forEach(a=>a.classList.remove('speaking'));};
      audio.onerror=()=>{URL.revokeObjectURL(url);currentAudio=null;setMainState('idle');};
      await audio.play();
      return;
    }catch(e){
      console.warn('Groq TTS failed — falling back to browser voice.',e.message);
      setVoiceTag('BROWSER','amber');
      stopSpeaking();
    }
  }else{
    setVoiceTag('BROWSER','amber');
  }
  speakFallback(raw);
}

  const MAX=500000;let text='';
  if(file.type==='application/pdf'){if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}try{const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise,parts=[];for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();parts.push(c.items.map(it=>it.str).join(' '));}text=parts.join('\n\n');}catch(e){return sysMsg(`⚠ Could not read PDF: ${e.message}`);}}
  else{try{text=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file,'utf-8');});}catch(e){return sysMsg(`⚠ Could not read "${file.name}".`);}}
  if(!text.trim())return sysMsg(`⚠ "${file.name}" appears empty.`);
  if(text.length>MAX)text=text.slice(0,MAX)+'\n\n[… truncated …]';
  DocCtx.load(file.name,text);showDocUI(file.name,DocCtx.wordCount);
  sysMsg(`📎 **${file.name}** loaded — ${DocCtx.wordCount.toLocaleString()} words · ${text.split('\n').length.toLocaleString()} lines.\n\n${DocCtx.summary()}\n\nAsk me anything about it, or try "What does this document cover?"`);
}
uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value='';});
dbClr.addEventListener('click',clearDoc);dsClr.addEventListener('click',clearDoc);

/* ══ RESPONSE ROUTER ══ */
function pick(text){
  const p=personality(text);if(p)return p;
  const lo=text.toLowerCase();
  if(DocCtx.loaded()){
    if(/what does this (doc|document|file) (cover|contain|say|include)|summary|overview|summarise|summarize/.test(lo)){const secs=DocCtx.chunks.slice(0,5).map(c=>`**${c.heading}**\n${c.text.trim().slice(0,120)}…`).join('\n\n');return `Here's what **${DocCtx.filename}** covers:\n\n${secs}\n\n> ${DocCtx.wordCount.toLocaleString()} words total. Ask me anything specific.`;}
    const results=DocCtx.search(text);
    if(results.length){const ex=results.map(r=>`**${r.heading}**\n${r.text.trim().slice(0,280)}${r.text.length>280?'…':''}`).join('\n\n---\n\n');return `From **${DocCtx.filename}**:\n\n${ex}\n\n> Based on your uploaded document. Ask a follow-up to dig deeper.`;}
    return `I didn't find a direct match in **${DocCtx.filename}** for that.\n\nTry "What does this document cover?" or rephrase your question. I can also answer general software development questions.`;
  }
  if(agent==='ticket'){return buildTickets(text);}
  if(/auth|login|jwt|token|middleware/.test(lo))return AGENTS.oracle.r.auth;
  if(/postgres|mongo|database|db/.test(lo))return AGENTS.oracle.r.postgres;
  if(/retry|policy|backoff/.test(lo))return AGENTS.oracle.r.retry;
  return AGENTS.oracle.r.default;
}

/* ══ RENDER ══ */
function sysMsg(md){const id=uid();msgs.push({role:'system',content:md,id});renderMsg(msgs[msgs.length-1]);}
function renderMsg(m){
  const isU=m.role==='user',isSys=m.role==='system';
  const div=document.createElement('div');div.className=`msg-row ${m.role}`;div.dataset.id=m.id;
  const av=isU?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M1 11c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`:
    `<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L10.5 6H15L11 9.5L12.5 15L8 12L3.5 15L5 9.5L1 6H5.5L8 1Z"/></svg>`;
  div.innerHTML=`<div class="m-av">${av}</div><div class="m-body"><div class="m-bubble" data-bubble>${m.thinking?'<div class="thinking"><span></span><span></span><span></span></div>':(isU?esc(m.content):fmt(m.content))}</div></div>`;
  messages.appendChild(div);scrollB();
}
async function streamText(id,text){
  const row=messages.querySelector(`[data-id="${id}"]`);if(!row)return;
  const bubble=row.querySelector('[data-bubble]');bubble.innerHTML='';await sleep(80);
  const tokens=text.split(/(\s+)/);let built='';
  for(const tok of tokens){built+=tok;bubble.innerHTML=fmt(built)+'<span class="cur"></span>';scrollB();if(tok.trim())await sleep(13+Math.random()*20);}
  bubble.innerHTML=fmt(built);
}
async function sendMsg(text){
  text=text.trim();if(!text||streaming)return;streaming=true;sendBtn.disabled=true;setMainState('thinking');
  const id1=uid();msgs.push({role:'user',content:text,id:id1});renderMsg(msgs[msgs.length-1]);
  const id2=uid();msgs.push({role:'ai',content:'',id:id2,thinking:true});renderMsg(msgs[msgs.length-1]);
  await sleep(!!personality(text)?260:480+Math.random()*360);
  const resp=pick(text);msgs[msgs.length-1].thinking=false;msgs[msgs.length-1].content=resp;
  await streamText(id2,resp);speakText(resp);
  streaming=false;updateSend();
}

/* ══ AUTO GREETING ══ */
async function autoGreet(){
  await sleep(1000);if(msgs.length>0)return;
  const greet="Hey there! 👋 My name is **Swimple** — your personal helper for all your IT needs.\n\nI'm here to help with your codebase questions, document analysis, dev tickets, and more.\n\n**Let's tackle today's tasks!** 🚀";
  const id=uid();msgs.push({role:'ai',content:greet,id});renderMsg(msgs[msgs.length-1]);
  speakText(greet);
}

function updateSend(){sendBtn.disabled=!inputEl.value.trim()||streaming;}
inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px';updateSend();});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sendBtn.disabled){const t=inputEl.value;inputEl.value='';inputEl.style.height='auto';updateSend();sendMsg(t);}}});
sendBtn.addEventListener('click',()=>{if(!sendBtn.disabled){const t=inputEl.value;inputEl.value='';inputEl.style.height='auto';updateSend();sendMsg(t);}});

/* ══ AGENT SWITCH ══ */
function switchAgent(a){
  agent=a;msgs=[];
  document.querySelectorAll('.ap').forEach(b=>b.classList.toggle('active',b.dataset.a===a));
  const cfg=AGENTS[a];
  if(avName)avName.textContent=cfg.name;
  if(avSub)avSub.textContent=cfg.sub;
  if(phName)phName.textContent=cfg.name;
  if(modePill)modePill.textContent=cfg.badge;
  inputEl.placeholder=cfg.placeholder;
  const n=$('vcNm');if(n)n.textContent=a==='oracle'?'Oracle':'Ticket Builder';
  const m=$('vcModeT');if(m)m.textContent=a==='oracle'?'ORACLE MODE':'TICKET MODE';
  messages.innerHTML='';
  autoGreet();
}
$('btnOracle').addEventListener('click',()=>switchAgent('oracle'));
$('btnTicket').addEventListener('click',()=>switchAgent('ticket'));
$('newBtn').addEventListener('click',()=>{msgs=[];messages.innerHTML='';autoGreet();});
$('themeBtn').addEventListener('click',()=>{const t=['system','dark','light'];theme=t[(t.indexOf(theme)+1)%3];theme==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',theme);});

/* ══ CHAT PANEL TOGGLE ══ */
const chatPanel=$('chatPanel');
chatPanel.classList.remove('hide'); // always visible on load
$('chatToggleBtn').addEventListener('click',()=>chatPanel.classList.toggle('hide'));
$('panelCloseBtn').addEventListener('click',()=>chatPanel.classList.add('hide'));
function updatePanelVisibility(){
  if(window.innerWidth>768)chatPanel.classList.remove('hide');
}
window.addEventListener('resize',updatePanelVisibility);

/* ══ CHIP CLICKS ══ */
messages.addEventListener('click',e=>{const chip=e.target.closest('.chip');if(chip){inputEl.value=chip.textContent;updateSend();inputEl.focus();}});

/* ══ VC POPUP ══ */
const vcBd=$('vcBd'),vcPop=$('vcPop'),vcCanvas=$('vcCanvas'),vcTimer=$('vcTimer'),vcSt=$('vcSt'),vcTr=$('vcTr');
const VC_DPR=Math.min(window.devicePixelRatio||1,2),VC_SZ=190;
vcCanvas.width=VC_SZ*VC_DPR;vcCanvas.height=VC_SZ*VC_DPR;
const vctx=vcCanvas.getContext('2d');vctx.scale(VC_DPR,VC_DPR);
const VX=VC_SZ/2,VY=VC_SZ/2;
let vcOpen=false,vcState='idle',vcMuted=false,vcSecs=0,vcInt=null,vcRaf=null,vcACtx=null,vcAn=null,vcStream=null,vcRec=null,vcSimP=0;
function setVcSt(s){vcState=s;vcSt.className='vc-st';const L={idle:'STANDBY',listening:'LISTENING…',processing:'THINKING…',speaking:'RESPONDING…'};vcSt.textContent=L[s]||s.toUpperCase();if(s==='listening')vcSt.classList.add('listening');if(s==='processing'||s==='speaking')vcSt.classList.add('processing');}
function vcDraw(){vcRaf=requestAnimationFrame(vcDraw);vctx.clearRect(0,0,VC_SZ,VC_SZ);const t=performance.now()/1000,isA=vcState!=='idle',isL=vcState==='listening',isSp=vcState==='speaking',isPr=vcState==='processing';const r3=76,op3=isA?.45:.18;vctx.save();vctx.translate(VX,VY);vctx.rotate(t*.18);vctx.setLineDash([2,10]);vctx.strokeStyle=`rgba(237,174,73,${op3})`;vctx.lineWidth=.8;vctx.beginPath();vctx.arc(0,0,r3,0,Math.PI*2);vctx.stroke();for(let i=0;i<30;i++){const a=(i/30)*Math.PI*2,lg=i%5===0;vctx.setLineDash([]);vctx.strokeStyle=`rgba(237,174,73,${lg?op3*1.5:op3*.5})`;vctx.lineWidth=lg?1.1:.5;vctx.beginPath();vctx.moveTo(Math.cos(a)*(r3-(lg?6:2)),Math.sin(a)*(r3-(lg?6:2)));vctx.lineTo(Math.cos(a)*(r3+(lg?6:2)),Math.sin(a)*(r3+(lg?6:2)));vctx.stroke();}vctx.restore();const r2=58,op2=isA?.6:.22;vctx.save();vctx.translate(VX,VY);vctx.rotate(-t*.28);vctx.setLineDash([]);vctx.lineWidth=1;for(let i=0;i<3;i++){const s=i*(Math.PI*2/3),alpha=isPr?op2*(.5+.5*Math.sin(t*4+i)):op2;vctx.strokeStyle=`rgba(237,174,73,${alpha})`;vctx.beginPath();vctx.arc(0,0,r2,s,s+Math.PI*.55);vctx.stroke();}vctx.restore();const r1=42,op1=isA?.7:.25;vctx.save();vctx.translate(VX,VY);vctx.rotate(t*.55);vctx.setLineDash([]);vctx.lineWidth=1.2;for(let i=0;i<4;i++){const alpha=isL?op1*(.6+.4*Math.sin(t*8+i*1.5)):op1;vctx.strokeStyle=`rgba(237,174,73,${alpha})`;vctx.beginPath();vctx.arc(0,0,r1,i*(Math.PI/2),i*(Math.PI/2)+Math.PI*.36);vctx.stroke();}vctx.restore();const wBase=46;if(isL&&vcAn){const fd=new Uint8Array(vcAn.frequencyBinCount);vcAn.getByteFrequencyData(fd);for(let i=0;i<Math.min(48,fd.length);i++){const angle=(i/48)*Math.PI*2-Math.PI/2,norm=fd[i]/255;vctx.strokeStyle=`rgba(237,174,73,${.3+.65*norm})`;vctx.lineWidth=1.8;vctx.beginPath();vctx.moveTo(VX+Math.cos(angle)*wBase,VY+Math.sin(angle)*wBase);vctx.lineTo(VX+Math.cos(angle)*(wBase+norm*26),VY+Math.sin(angle)*(wBase+norm*26));vctx.stroke();}}else if(isSp){vcSimP+=.04;for(let i=0;i<48;i++){const angle=(i/48)*Math.PI*2-Math.PI/2,wave=Math.sin(vcSimP*3.5+i*.22)*.55+.5,d=Math.sin(vcSimP*14+i*.9)*.12;vctx.strokeStyle=`rgba(237,174,73,${.25+.5*wave})`;vctx.lineWidth=1.8;vctx.beginPath();vctx.moveTo(VX+Math.cos(angle)*wBase,VY+Math.sin(angle)*wBase);vctx.lineTo(VX+Math.cos(angle)*(wBase+(wave+d)*20),VY+Math.sin(angle)*(wBase+(wave+d)*20));vctx.stroke();}}const breathe=1+(isL?.07:.03)*Math.sin(t*(isL?4:1.8)),orbR=28*breathe,intensity=isSp?1:isL?.92:isPr?.85:.7;const glow=vctx.createRadialGradient(VX,VY,0,VX,VY,orbR*3);glow.addColorStop(0,`rgba(237,174,73,${intensity*.18})`);glow.addColorStop(1,'rgba(237,174,73,0)');vctx.beginPath();vctx.arc(VX,VY,orbR*3,0,Math.PI*2);vctx.fillStyle=glow;vctx.fill();const grad=vctx.createRadialGradient(VX-orbR*.28,VY-orbR*.28,0,VX,VY,orbR);grad.addColorStop(0,`rgba(255,225,150,${intensity})`);grad.addColorStop(.45,`rgba(237,174,73,${intensity*.9})`);grad.addColorStop(1,`rgba(160,90,20,${intensity*.65})`);vctx.beginPath();vctx.arc(VX,VY,orbR,0,Math.PI*2);vctx.fillStyle=grad;vctx.fill();}
function vcTick(){vcSecs++;const m=String(Math.floor(vcSecs/60)).padStart(2,'0'),s=String(vcSecs%60).padStart(2,'0');vcTimer.textContent=`${m}:${s}`;vcTimer.classList.add('active');}
function vcLine(role,text){const d=document.createElement('div');d.className=`vtl ${role}`;d.innerHTML=`<span class="vw">${role==='user'?'You':'Swimple'}:</span><span>${esc(text)}</span>`;vcTr.appendChild(d);vcTr.scrollTop=vcTr.scrollHeight;}
async function vcInitAudio(){if(vcACtx)return true;try{vcStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});vcACtx=new AudioContext();vcAn=vcACtx.createAnalyser();vcAn.fftSize=128;vcAn.smoothingTimeConstant=.78;vcACtx.createMediaStreamSource(vcStream).connect(vcAn);return true;}catch(e){vcLine('ai','⚠ Mic access denied.');return false;}}
function vcBuildRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.continuous=false;r.interimResults=true;r.lang='en-US';let interim='';r.onresult=e=>{let f='',i='';for(let j=e.resultIndex;j<e.results.length;j++){e.results[j].isFinal?(f+=e.results[j][0].transcript):(i+=e.results[j][0].transcript);}interim=(f||i).trim();};r.onend=async()=>{const q=interim;interim='';if(!q||!vcOpen){if(vcOpen)setVcSt('listening');return;}vcLine('user',q);setVcSt('processing');await sleep(400+Math.random()*350);const resp=pick(q);const clean=resp.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/[📎◆◈🚀🐛👋🙌]/g,'').replace(/\n/g,' ').trim().slice(0,200)+(resp.length>200?'…':'');vcLine('ai',clean);setVcSt('speaking');sendMsg(q);if(voiceOn){stopSpeaking();const _a=await speakText(resp);setTimeout(()=>{if(vcOpen){setVcSt('listening');vcStartListen();}},2200);}else{await sleep(1500);if(vcOpen){setVcSt('listening');vcStartListen();}}};r.onerror=e=>{if(e.error!=='no-speech'&&vcOpen)vcLine('ai',`⚠ ${e.error}`);if(vcOpen)setVcSt('listening');};return r;}
function vcStartListen(){if(!vcOpen||vcMuted)return;if(!vcRec)vcRec=vcBuildRec();if(!vcRec){vcLine('ai','⚠ Needs Chrome or Edge.');return;}try{vcRec.start();}catch(_){}}
async function openCall(){if(vcOpen)return;vcOpen=true;vcBd.classList.add('open');vcPop.classList.add('open');$('voiceFab').classList.add('active');vcTr.innerHTML='';vcLine('ai','Connected. Ask me anything.');vcSecs=0;vcTimer.textContent='00:00';vcTimer.classList.remove('active');vcInt=setInterval(vcTick,1000);setVcSt('listening');vcDraw();const ok=await vcInitAudio();if(!ok){setVcSt('idle');return;}if(!window.SpeechRecognition&&!window.webkitSpeechRecognition){vcLine('ai','⚠ Needs Chrome or Edge.');setVcSt('idle');return;}vcStartListen();}
function closeCall(){if(!vcOpen)return;vcOpen=false;try{vcRec?.stop();}catch(_){}vcRec=null;synth?.cancel();clearInterval(vcInt);cancelAnimationFrame(vcRaf);vcRaf=null;vcPop.classList.remove('open');vcBd.classList.remove('open');$('voiceFab').classList.remove('active');setVcSt('idle');}
$('ecBtn').addEventListener('click',closeCall);
vcBd.addEventListener('click',e=>{if(e.target===vcBd)closeCall();});
$('vcMuteBtn').addEventListener('click',()=>{vcMuted=!vcMuted;$('vcMuteBtn').classList.toggle('on',vcMuted);if(vcMuted){try{vcRec?.stop();}catch(_){}}else if(vcState==='listening')vcStartListen();});
$('vcSpkBtn').addEventListener('click',()=>{voiceOn=!voiceOn;$('vcSpkBtn').classList.toggle('on',voiceOn);voiceBtn.classList.toggle('on',voiceOn);if(!voiceOn)synth?.cancel();});
$('micBtn').addEventListener('click',openCall);
$('voiceFab').addEventListener('click',openCall);
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&vcOpen){e.preventDefault();closeCall();}});

/* ══ BOOT ══ */
if(synth)synth.getVoices();
window._swimpleState='idle';
// Hide loading spinner after 6s regardless of GLB status
setTimeout(()=>{const l=document.getElementById('avLoad');if(l)l.style.display='none';},6000);
window.addEventListener('load',autoGreet);
</script>
